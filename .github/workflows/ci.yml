

        name: CI - Tests

on:
  push:
    branches: [ main, feature/django-setup ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DEBUG: "False"
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALLOWED_HOSTS: "127.0.0.1,localhost"
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer les tests Pytest
        continue-on-error: true
        run: pytest --json-report --json-report-file=pytest-report.json

      - name: Analyser la securite avec Bandit
        continue-on-error: true
        run: bandit -r . -x venv,migrations -f json -o bandit-report.json

      - name: Analyser la qualite avec Pylint
        continue-on-error: true
        run: pylint --disable=missing-module-docstring,missing-class-docstring,missing-function-docstring,too-few-public-methods accounts projects tasks workspaces --output-format=json > pylint-report.json

      - name: Evaluation du risque par Gemini
        run: python scripts/ai_risk_gate.py

      - name: Sauvegarder les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            pytest-report.json
            bandit-report.json
            pylint-report.json
            ai-risk-report.json

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-testc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-testc:${{ github.sha }}